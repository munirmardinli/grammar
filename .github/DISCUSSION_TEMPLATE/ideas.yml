title: Idea or suggestion
labels:
  - idea
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to improve or add?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who would benefit from this idea, and in what situation?
    validations:
      required: true
